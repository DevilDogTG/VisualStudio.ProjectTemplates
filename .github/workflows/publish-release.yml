name: Publish Release

# Triggered when a release-* PR is merged into main.
# Steps: extract version → export package → tag → push to NuGet.
on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  publish:
    name: Tag & Publish to NuGet
    # Only run when the PR was actually merged and came from a release branch.
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release-')
    runs-on: windows-latest
    permissions:
      contents: write   # push git tag

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Extract version from branch name
        id: version
        shell: pwsh
        run: |
          $branch  = "${{ github.event.pull_request.head.ref }}"
          $version = $branch -replace '^release-', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release version: $version"

      - name: Export template package
        shell: pwsh
        run: |
          .\scripts\templates\Export-DotnetCliTemplate.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Tag release and push
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Push package to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          $pkg = Get-ChildItem -Path artifacts `
                   -Filter "DMNSN.ProjectTemplates.${{ steps.version.outputs.version }}.nupkg" |
                   Select-Object -First 1
          if (-not $pkg) {
            Write-Error "Package DMNSN.ProjectTemplates.${{ steps.version.outputs.version }}.nupkg not found in artifacts/."
            exit 1
          }
          dotnet nuget push $pkg.FullName `
            --source https://api.nuget.org/v3/index.json `
            --api-key $env:NUGET_API_KEY
          Write-Host "Published: $($pkg.Name)"
